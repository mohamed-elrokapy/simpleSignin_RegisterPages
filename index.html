<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Global Book (demo)</title>
    <meta
      name="description"
      content="Front-end demo of a sign-in page. There is no server and no real account."
    />
    <link rel="stylesheet" href="style/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="brand">
        <div class="brand__inner">
          <p class="brand__name">Global Book</p>
          <h1 class="brand__title">Connect with friends and the world around you.</h1>
          <p class="brand__demo">
            This is a front-end demo. There is no server and no real account.
          </p>
        </div>
      </aside>

      <main class="panel">
        <div class="card">
          <h2 class="card__title">Log in</h2>

          <p class="notice" role="note">
            <strong>Demo only.</strong> Nothing you type is sent, saved or checked
            against an account. Passwords are never stored.
          </p>

          <form
            id="signin-form"
            class="form"
            novalidate
            data-success-url="pages/welcome.html?from=signin"
          >
            <div class="field">
              <label for="identifier">Email or phone number</label>
              <input
                type="text"
                id="identifier"
                autocomplete="username"
                inputmode="email"
                autocapitalize="off"
                spellcheck="false"
                aria-describedby="identifier-error"
              />
              <p class="field__error" id="identifier-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="password">
                <input
                  type="password"
                  id="password"
                  autocomplete="current-password"
                  aria-describedby="password-hint password-error"
                />
                <button
                  type="button"
                  class="password__toggle"
                  data-toggle-password="password"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
              <p class="field__hint" id="password-hint">At least 8 characters.</p>
              <p class="field__error" id="password-error" aria-live="polite"></p>
            </div>

            <button type="submit" class="btn btn--primary">Log in</button>
          </form>

          <hr class="divider" />

          <p class="alt">
            New here?
            <a class="btn btn--secondary" href="pages/signup.html">Create new account</a>
          </p>
        </div>
      </main>
    </div>

    <script src="js/validate.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/signin.js"></script>
  </body>
</html>
